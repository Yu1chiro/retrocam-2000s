<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#d8cfb5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Retro Cam">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Retro Cam</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/fonts.css">
<style>
  :root{--body:#e6dcc3;--body2:#cdc2a6;--key:#4d4a42;--lcd:#9fbf3a;--lcd-d:#2a3a14;--amber:#ff8a1f;
    --edge:#3b372f;--tx:#5b5444;--tx2:#6b6454;--line:#8a8068;--sheet:#efe6cf;--sheet-tx:#4a4437;--keytx:#f1e8d0;--bg:#2a2722;--lcd-line:#4a5f22;--shut1:#e0634a;--shut2:#8f2c1a;
    --gal-bg:#e6dcc3;--gal-card:#f7f1e0;--gal-ink:#3f3a2e;--gal-acc:#3d6aa6;--gal-line:#b9ad8f;--gal-on:#fff}
  html,body{height:100%;margin:0;background:var(--bg);overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
  body{font-family:'VT323',monospace;color:#dfe8c0;user-select:none;-webkit-user-select:none}
  #app{position:relative;margin:0 auto;height:100dvh;max-width:440px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--body),var(--body2));
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  @media(min-width:520px){#app{height:min(100dvh - 24px,780px);margin-top:12px;border-radius:44px;border:4px solid var(--edge);box-shadow:0 30px 80px #000a}}
  .status{display:flex;justify-content:space-between;align-items:center;padding:8px 18px 4px;font-size:22px;color:var(--tx)}
  .bars i{display:inline-block;width:4px;margin-right:2px;background:var(--tx);vertical-align:bottom}
  .lcd{position:relative;margin:0 14px;border-radius:10px;overflow:hidden;background:#000;flex:1;min-height:0;
    border:3px solid var(--edge);box-shadow:inset 0 0 0 2px var(--tx2)}
  #cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#111}
  .hud{position:absolute;left:0;right:0;display:flex;justify-content:space-between;padding:6px 10px;font-size:22px;color:#fff;text-shadow:0 0 4px #000,1px 1px 0 #000;pointer-events:none}
  .hud.top{top:0}.hud.bot{bottom:0}
  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #flash.go{animation:fl .35s ease-out}
  @keyframes fl{0%{opacity:.95}100%{opacity:0}}
  #msg{position:absolute;inset:0;z-index:6;flex-direction:column;gap:14px;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:24px;color:var(--lcd);background:var(--lcd-d)}
  .lenses{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
  .lenses::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:2px 12px;font-size:22px;border-radius:999px;border:2px solid var(--line);color:var(--tx);background:transparent}
  .chip.on{background:var(--lcd);color:var(--lcd-d);border-color:var(--lcd)}
  .zoomrow{display:flex;align-items:center;gap:10px;padding:2px 18px}
  .zoomrow button{width:34px;height:34px;border-radius:50%;background:var(--key);color:var(--keytx);font-size:26px;line-height:1;border:2px solid var(--tx2)}
  input[type=range]{flex:1;accent-color:var(--lcd)}
  .keys{display:flex;align-items:center;justify-content:space-between;padding:6px 22px 14px}
  .soft{width:68px;height:48px;border-radius:14px;background:var(--key);border:2px solid var(--tx2);color:var(--keytx);font-size:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1;overflow:hidden}
  .soft img,.soft video{width:100%;height:100%;object-fit:cover}
  .shutter{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--shut1),var(--shut2));border:4px solid var(--edge);box-shadow:0 0 0 3px var(--line),0 6px 0 var(--edge);display:flex;align-items:center;justify-content:center}
  .shutter:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--line),0 2px 0 var(--edge)}
  .shutter b{width:34px;height:34px;border-radius:50%;border:4px solid var(--keytx)}
  button{cursor:pointer;font-family:inherit}
  #dev{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;pointer-events:none;z-index:5}
  #dev.go{animation:dev 1.2s ease-out forwards}
  @keyframes dev{0%{opacity:1;filter:brightness(2.8) blur(16px) sepia(1) saturate(.3)}55%{opacity:1;filter:brightness(1.3) blur(4px) sepia(.5)}75%{opacity:1;filter:none}100%{opacity:0;filter:none}}
  .shutter.vid b{border-color:#d9341c}
  .shutter.rec b{background:#d9341c;border-color:var(--keytx);border-radius:8px}
  #menu{position:absolute;inset:0;z-index:25;background:#0008;display:none;align-items:flex-end}
  #menu.open{display:flex}
  .sheet{width:100%;background:var(--sheet);border-radius:22px 22px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));color:var(--sheet-tx);font-size:22px;max-height:88%;overflow-y:auto}
  .sheet h3{margin:0 0 4px;font-size:28px;font-weight:400}
  .sheet label{display:flex;justify-content:space-between;margin-top:10px}
  .sheet .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  /* galeri */
  #gal{position:absolute;inset:0;z-index:20;background:var(--lcd-d);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #gal.open{display:flex}
  .ghead{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:26px;color:var(--lcd);border-bottom:2px solid var(--lcd-line)}
  .grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;align-content:start}
  .grid img,.grid video{width:100%;aspect-ratio:3/4;object-fit:cover;background:#111}
  .empty{grid-column:1/-1;text-align:center;color:var(--lcd);font-size:24px;padding:60px 20px}
  #view{position:absolute;inset:0;z-index:30;background:#000;display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #view.open{display:flex}
  #view img{flex:1;min-height:0;width:100%;object-fit:contain}
  .vbar{display:flex;gap:10px;justify-content:center;padding:12px;background:var(--lcd-d)}
  .vbar button{flex:1;max-width:120px;padding:4px 0;font-size:24px;border-radius:10px;background:var(--lcd);color:var(--lcd-d)}
  .vbar button.del{background:#b4442c;color:#fff}

  /* ===== Timer ===== */
  #cd{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;font-size:150px;color:#fff;text-shadow:0 0 18px #000,4px 4px 0 #000;background:#0003;pointer-events:none;animation:cdpop 1s ease-out infinite}
  @keyframes cdpop{0%{transform:scale(1.5);opacity:.4}25%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:.9}}
  #dev{object-fit:contain;background:#111}
  .sw{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--edge);margin-right:6px;vertical-align:middle}
  /* ===== Galeri cream/biru ===== */
  #gal{background:var(--gal-bg)}
  .ghead{background:var(--gal-card);color:var(--gal-ink);border-bottom:3px double var(--gal-line);font-size:28px}
  .ghead button{color:var(--gal-acc)!important;border:2px solid var(--gal-acc);border-radius:10px;padding:0 12px;font-size:24px!important;background:transparent}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px;padding:14px}
  .card{background:var(--gal-card);border:2px solid var(--gal-line);border-radius:12px;padding:8px 8px 6px;box-shadow:0 4px 0 var(--gal-line);cursor:pointer;transition:transform .12s,box-shadow .12s;outline:none}
  .card:active,.card:focus-visible{transform:translateY(3px);box-shadow:0 1px 0 var(--gal-line)}
  .card .ph{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--gal-bg);border:2px solid var(--gal-acc)}
  .card .ph img,.card .ph video{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;display:block}
  .card .tag{position:absolute;left:6px;top:6px;padding:0 8px;font-size:18px;line-height:1.3;background:var(--gal-acc);color:var(--gal-on);border-radius:999px}
  .card .cap{display:flex;justify-content:space-between;gap:6px;margin-top:6px;font-size:20px;line-height:1;color:var(--gal-ink)}
  .card .cap b{font-weight:400;color:var(--gal-acc)}
  .empty{color:var(--gal-ink)}
  .vbar{background:var(--gal-card);border-top:3px double var(--gal-line)}
  .vbar button{background:var(--gal-acc);color:var(--gal-on)}
  /* ===== Template sebelum simpan ===== */
  #tpl{position:absolute;inset:0;z-index:35;background:var(--gal-bg);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #tpl.open{display:flex}
  .tplwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
  #tplCv{max-width:100%;max-height:100%;box-shadow:0 10px 24px #0005}
  .tplrow{display:flex;gap:8px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}
  .tplrow::-webkit-scrollbar{display:none}
  .tplrow .chip{color:var(--gal-ink);border-color:var(--gal-line)}
  .tplrow .chip.on{background:var(--gal-acc);color:var(--gal-on);border-color:var(--gal-acc)}
  /* ===== Tema kamera ===== */
html[data-theme=blue]{--body:#cfe2f5;--body2:#9fbddf;--key:#2d4a78;--lcd:#5fb4ff;--lcd-d:#0e2a4d;--edge:#1c2f50;--tx:#2d4a78;--tx2:#4a6a99;--line:#6f8fb8;--sheet:#e7f0fa;--sheet-tx:#1f3556;--keytx:#eaf3ff;--bg:#101c2e;--lcd-line:#2b5a96;--shut1:#ff7a5c;--shut2:#b0301c;--gal-bg:#bcd3ec;--gal-card:#f1f6fc;--gal-ink:#1f3556;--gal-acc:#2a62b0;--gal-line:#8fb0d8}
html[data-theme=black]{--body:#4a4a4e;--body2:#26262a;--key:#0e0e10;--lcd:#ff9a2e;--lcd-d:#1c1308;--edge:#0a0a0b;--tx:#c9c3b6;--tx2:#a39d90;--line:#6d6a63;--sheet:#2c2c30;--sheet-tx:#ebe5d6;--keytx:#f1e8d0;--bg:#0a0a0b;--lcd-line:#6b4513;--shut1:#ff5a3c;--shut2:#9e1d0c;--gal-bg:#232326;--gal-card:#323237;--gal-ink:#ebe5d6;--gal-acc:#ff9a2e;--gal-line:#4b4b52;--gal-on:#1c1308}
html[data-theme=pink]{--body:#fbdbe8;--body2:#eeaac8;--key:#8a3d62;--lcd:#ff7fb8;--lcd-d:#4a1530;--edge:#5a1f3e;--tx:#8a3d62;--tx2:#a8567e;--line:#c27a9c;--sheet:#fdeaf2;--sheet-tx:#5a1f3e;--keytx:#fff0f6;--bg:#2b0f1e;--lcd-line:#a8386f;--shut1:#ff6b8f;--shut2:#b0204a;--gal-bg:#f4c8da;--gal-card:#fff2f7;--gal-ink:#5a1f3e;--gal-acc:#c2457c;--gal-line:#dd9bb8}
html[data-theme=mint]{--body:#d7efe4;--body2:#a2cdb9;--key:#3e5f52;--lcd:#47c28f;--lcd-d:#10332a;--edge:#1f3a30;--tx:#3e5f52;--tx2:#5a7d6f;--line:#7fa896;--sheet:#eaf7f0;--sheet-tx:#1f3a30;--keytx:#effaf4;--bg:#0f2019;--lcd-line:#2b7a5c;--shut1:#ff7a5c;--shut2:#b0301c;--gal-bg:#bfe0d1;--gal-card:#f1faf5;--gal-ink:#1f3a30;--gal-acc:#2f8d68;--gal-line:#8fc3ad}
html[data-theme=silver]{--body:#e4e7ec;--body2:#aeb6c1;--key:#4a5361;--lcd:#5aa6e0;--lcd-d:#16273a;--edge:#2b3340;--tx:#4a5361;--tx2:#667082;--line:#8c96a6;--sheet:#eef0f4;--sheet-tx:#2b3340;--keytx:#f2f4f8;--bg:#1b1f26;--lcd-line:#3b6a96;--shut1:#ff6f4f;--shut2:#a8281a;--gal-bg:#d0d6df;--gal-card:#f6f7fa;--gal-ink:#2b3340;--gal-acc:#3b6fb0;--gal-line:#a3adbb}
</style>
</head>
<body>
<div id="app">
  <div class="status">
    <span class="bars"><i style="height:5px"></i><i style="height:9px"></i><i style="height:13px"></i><i style="height:17px"></i></span>
    <span>CAMERA</span>
    <span id="clock">00:00</span>
  </div>

  <div class="lcd" id="lcd">
    <canvas id="cv" width="300" height="400"></canvas>
    <video id="v" playsinline muted autoplay style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
    <div class="hud top"><span id="lensName">KODAK</span><span id="zoomTxt">1.0x</span></div>
    <div class="hud bot"><span id="stampBtnTxt">DATE ON</span><span id="count">0 photos</span></div>
    <img id="dev" alt="">
    <div id="flash"></div>
    <div id="cd"></div>
    <div id="msg"><div id="msgTxt"></div><button class="chip on" id="camAsk">Turn on camera</button></div>
  </div>

  <div class="lenses" id="lenses"></div>
  <div class="zoomrow">
    <button id="zout" aria-label="Zoom out">−</button>
    <input type="range" id="zoom" min="1" max="5" step="0.1" value="1" aria-label="Zoom">
    <button id="zin" aria-label="Zoom in">+</button>
  </div>

  <div class="keys">
    <button class="soft" id="openGal" aria-label="Gallery"><span id="thumbTxt">Gallery</span></button>
    <button class="shutter" id="shot" aria-label="Take photo"><b></b></button>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="soft" id="flip" style="height:24px;font-size:20px">Flip</button>
      <button class="soft" id="menuBtn" style="height:24px;font-size:20px">Menu</button>
    </div>
  </div>

  <div id="menu"><div class="sheet">
    <h3>SETTINGS</h3>
    <label>Mode</label><div class="row" id="modeRow"><button class="chip on" data-m="photo">PHOTO</button><button class="chip" data-m="video">VIDEO</button></div>
    <label>Timer</label><div class="row" id="timerRow"><button class="chip on" data-t="0">OFF</button><button class="chip" data-t="5">5 SEC</button><button class="chip" data-t="10">10 SEC</button></div>
    <label>Permissions</label><div class="row"><button class="chip" id="camToggle"></button><button class="chip" id="micToggle"></button></div><div id="permNote" style="font-size:18px;opacity:.75;margin-top:4px"></div>
    <label>Format</label><div class="row" id="fmtRow"></div>
    <label>Brightness <span id="briTxt">0</span></label><input type="range" id="bri" min="-60" max="60" step="5" value="0">
    <label>Date stamp</label><div class="row"><button class="chip on" id="stampBtn">ON</button></div>
    <label>Camera theme</label><div class="row" id="themeRow"></div>
    <button class="chip" id="closeMenu" style="margin-top:14px;width:100%">Done</button>
  </div></div>
  <div id="gal">
    <div class="ghead"><span>GALLERY</span><button id="closeGal" style="color:var(--lcd);font-size:26px">Back</button></div>
    <div class="grid" id="grid"></div>
  </div>
  <div id="tpl">
    <div class="ghead"><span>CHOOSE A TEMPLATE</span></div>
    <div class="tplwrap"><canvas id="tplCv" width="300" height="400"></canvas></div>
    <div class="tplrow" id="tplRow"></div>
    <div class="vbar"><button id="tplSave">Save</button><button class="del" id="tplCancel">Discard</button></div>
  </div>
  <div id="view">
    <img id="viewImg" alt="Photo"><video id="viewVid" controls playsinline style="display:none;flex:1;min-height:0;width:100%;background:#000"></video>
    <div class="vbar"><button id="share">Share</button><button id="dl">Save</button><button class="del" id="del">Delete</button><button id="closeView">Close</button></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const video = $('#v'), cv = $('#cv'), cx = cv.getContext('2d');
const tmp = document.createElement('canvas'), tx = tmp.getContext('2d', { willReadFrequently: true });

// ===== Lens =====
// lw: lebar render rendah (efek pixel), sat/con/bri, mul/add: tint RGB, fade: hitam terangkat, grain, vig, scan: scanline
const LENS = {
  kodak:   { name:'KODAK',  sat:1.25, con:1.12, bri:6,  mul:[1.06,1.02,.9],  add:[6,4,-4],  fade:.10, grain:26, vig:.45 },
  nokia:   { name:'NOKIA',  lw:120, pal:[[34,48,22],[74,98,42],[134,158,64],[184,206,96]], con:1.25, grain:10 },
  vga:     { name:'VGA 2003', lw:200, sat:.8, con:1.1, bri:10, mul:[1,1.02,1.08], add:[0,4,8], fade:.06, grain:20, vig:.2 },
  dispo:   { name:'DISPO',  sat:1.4, con:1.3, bri:22, mul:[1.1,1,.88], add:[10,0,-6], fade:.04, grain:34, vig:.65 },
  vhs:     { name:'CAMCORDER', lw:240, sat:1.1, con:1.05, bri:4, mul:[.95,1.05,1.12], add:[0,6,12], fade:.12, grain:30, vig:.35, scan:1 },
  bw:      { name:'B&W FILM', sat:0, con:1.35, bri:0, mul:[1,1,1], add:[0,0,0], fade:.08, grain:38, vig:.55 },
  polaroid:{ name:'POLAROID', sat:.85, con:.95, bri:14, mul:[1.08,.98,1.0], add:[14,0,10], fade:.22, grain:16, vig:.3 }
};
// Parameter tambahan: bloom (cahaya meluber), hal (halation merah di highlight), leak (light leak), dust (debu & goresan), frame (bingkai)
Object.assign(LENS.kodak,    { bloom:.18, hal:.25, leak:.30, dust:1 });
Object.assign(LENS.dispo,    { bloom:.22, hal:.35, leak:.50, dust:1 });
Object.assign(LENS.vga,      { bloom:.12 });
Object.assign(LENS.polaroid, { bloom:.28, hal:.30, leak:.35, dust:1, frame:1 });
Object.assign(LENS.bw,       { bloom:.15, dust:1 });
LENS.dreamy = { name:'DREAMY', sat:1.05, con:.88, bri:18, mul:[1.07,1,1.08], add:[16,6,20], fade:.20, grain:18, vig:.40, bloom:.55, hal:.55, leak:.50, dust:1 };
delete LENS.nokia; // diganti varian Nokia lawas (non-hijau)
Object.assign(LENS, {
  fuji400:  { name:'FUJI 400',  sat:1.22, con:1.10, bri:4,  mul:[.97,1.04,1.02], add:[-2,6,3],   fade:.08, grain:28, vig:.40, bloom:.12, leak:.12, dust:1 },
  velvia:   { name:'VELVIA',    sat:1.65, con:1.28, bri:0,  mul:[1.04,1,.95],     add:[4,0,-4],   fade:.02, grain:18, vig:.50, bloom:.10, dust:1 },
  fujic200: { name:'FUJI C200', sat:.95,  con:1.05, bri:8,  mul:[.94,1.03,1.08],  add:[-4,8,12],  fade:.14, grain:30, vig:.38, bloom:.15, hal:.10, leak:.20, dust:1 },
  agfa:     { name:'AGFA',      sat:1.10, con:1.08, bri:2,  mul:[1.1,1,.86],      add:[14,2,-8],  fade:.16, grain:32, vig:.50, bloom:.14, hal:.30, leak:.28, dust:1 },
  lomo:     { name:'LOMO',      sat:1.50, con:1.35, bri:-4, mul:[1.08,1.04,.92],  add:[8,-2,6],   fade:.05, grain:36, vig:.95, leak:.20, dust:1 },
  trix:     { name:'TRI-X',     sat:0,    con:1.55, bri:-6, mul:[1,1,1],          add:[0,0,0],    fade:.05, grain:60, vig:.60, dust:1 },
  digicam:  { name:'DIGICAM 2002', lw:320, sat:1.15, con:1.18, bri:14, mul:[1,1,1.08], add:[0,0,6],  fade:.04, grain:16, vig:.15, bloom:.20 },
  nokia03:  { name:'NOKIA 2003', lw:128, post:5, grid:1, gridc:'rgba(10,20,40,.18)', sat:1.35, con:1.2, bri:6, mul:[1,1.03,1.1], add:[0,4,10], fade:.06, grain:14, vig:.2 },
  nokia00:  { name:'NOKIA 2000', lw:96, pal:[[24,30,44],[72,86,116],[132,150,180],[196,212,232]], con:1.3, grain:10, gridc:'rgba(10,16,30,.2)', ink:'#0c1424' },
  nokia80:  { name:'NOKIA 1980', lw:64, pal:[[22,8,0],[96,42,0],[196,104,6],[255,184,48]], con:1.35, grain:12, gridc:'rgba(40,12,0,.22)', ink:'#2a0e00' },
  bbpearl:  { name:'BB PEARL',  lw:160, post:40, sat:.88, con:1.15, bri:6,  mul:[1,1.03,1.06], add:[0,4,8], fade:.12, grain:30, vig:.30 },
  bbcurve:  { name:'BB CURVE',  lw:240, post:56, sat:.78, con:1.22, bri:12, mul:[1.02,1,1.06], add:[2,2,8], fade:.10, grain:34, vig:.35, bloom:.10 },
  super8:   { name:'SUPER 8',   lw:280, sat:1.1, con:1.12, bri:8, mul:[1.1,1,.84], add:[14,4,-10], fade:.20, grain:46, vig:.70, bloom:.20, hal:.35, leak:.35, dust:1 }

const LENS_ORDER = ['kodak','fuji400','velvia','fujic200','agfa','lomo','dispo','polaroid','dreamy','bw','trix','vga','digicam','nokia03','nokia00','nokia80','bbpearl','bbcurve','vhs','super8'];

let seed = Math.random() * 1e9 | 0;
const rnd = s => () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
const bl = document.createElement('canvas'), bx = bl.getContext('2d');

// Efek lapisan akhir: bloom, light leak, debu, bingkai
function finish(ctx, W, H, L) {
  const k = W / 300, r = rnd(seed);
  if (L.bloom) {
    bl.width = Math.round(W / 10); bl.height = Math.round(H / 10);
    bx.drawImage(tmp, 0, 0, bl.width, bl.height);
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = L.bloom;
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';

  if (L.leak) {
    const x = r() < .5 ? 0 : W, y = r() * H * .75, rad = W * (.6 + r() * .5);
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
    g.addColorStop(0, 'rgba(255,70,20,.9)'); g.addColorStop(.45, 'rgba(255,170,50,.4)'); g.addColorStop(1, 'rgba(255,200,80,0)');
    ctx.save(); ctx.globalCompositeOperation = 'screen'; ctx.globalAlpha = L.leak;
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
  if (L.dust) {
    ctx.save();
    for (let i = 0; i < 16; i++) {
      ctx.fillStyle = r() < .7 ? 'rgba(255,255,255,.55)' : 'rgba(20,10,0,.45)';
      ctx.beginPath(); ctx.arc(r() * W, r() * H, (.5 + r() * 1.3) * k, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = Math.max(1, k * .6);
    for (let i = 0; i < 2; i++) { const x = r() * W; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + (r() - .5) * 8 * k, H); ctx.stroke(); }
    ctx.restore();
  }
  if (L.frame) { // bingkai Polaroid
    const p = W * .06, b = W * .22;
    ctx.fillStyle = '#f3eee1';
    ctx.fillRect(0, 0, W, p); ctx.fillRect(0, 0, p, H); ctx.fillRect(W - p, 0, p, H); ctx.fillRect(0, H - b, W, b);
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = k; ctx.strokeRect(p, p, W - 2 * p, H - p - b);
  }
}

// ===== Render satu frame dengan efek lens =====
function render(ctx, W, H) {
  const L = LENS[lens];

  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw) return;
  const ar = w / h; let sw = vw, sh = vw / ar;
  if (sh > vh) { sh = vh; sw = vh * ar; }
  sw /= zoom; sh /= zoom;
  tx.save();
  if (mirror) { tx.translate(w, 0); tx.scale(-1, 1); }
  tx.drawImage(video, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, w, h);
  tx.restore();

  const im = tx.getImageData(0, 0, w, h), d = im.data, cxm = w / 2, cym = h / 2;

    const B0 = L.bri + userBri; r = (r - 128) * L.con + 128 + B0; g = (g - 128) * L.con + 128 + B0; b = (b - 128) * L.con + 128 + B0;
    r = r * L.mul[0] + L.add[0]; g = g * L.mul[1] + L.add[1]; b = b * L.mul[2] + L.add[2];
    r = r * (1 - L.fade) + L.fade * 70; g = g * (1 - L.fade) + L.fade * 66; b = b * (1 - L.fade) + L.fade * 80;
    if (L.hal) { const hh = Math.max(0, lum - 170) * L.hal; r += hh * 1.2; g += hh * .3; }
    const x = (p % w) - cxm, y = ((p / w) | 0) - cym;

    const vg = 1 - L.vig * dist * 1.4;
    const n = (Math.random() - .5) * L.grain;
    let sc = 1; if (L.scan && ((p / w) | 0) % 3 === 0) sc = .82;
    d[i] = (r * vg + n) * sc; d[i+1] = (g * vg + n) * sc; d[i+2] = (b * vg + n) * sc;

  }
  tx.putImageData(im, 0, 0);

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(tmp, 0, 0, W, H);

  if (L.pal || L.grid) { // garis kisi LCD Nokia
    ctx.fillStyle = L.gridc || 'rgba(20,32,10,.18)';

  }

}

// ===== Stempel tanggal ala kamera film =====
function stampText() {
  const t = new Date(), p = n => String(n).padStart(2, '0');

}
function drawStamp(ctx, W, H, L) {
  if (L.frame) {
    ctx.save();
    ctx.font = `600 ${Math.round(W * 0.085)}px 'Caveat', cursive`;
    ctx.textAlign = 'center'; ctx.fillStyle = '#3b3a36';
    ctx.translate(W / 2, H - W * 0.075); ctx.rotate(-0.025);
    ctx.fillText(stampText(), 0, 0);
    ctx.restore();
    return;
  }
  const fs = Math.round(W * 0.075);
  ctx.save();
  ctx.font = `${fs}px 'VT323', monospace`;

  ctx.fillStyle = L.pal ? (L.ink || '#1b2a0c') : '#ff8a1f';

}

// ===== Loop pratinjau (dibatasi fps agar terasa jadul) =====
function loop(t) {
  requestAnimationFrame(loop);

}

// ===== Ambil foto =====
function click() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .07].forEach(t => {
      const n = ac.sampleRate * .08 | 0, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = buf; f.type = 'bandpass'; f.frequency.value = t ? 1500 : 2400; g.gain.value = .6;
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start(ac.currentTime + t);
    });
  } catch (_) {}
}

  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)(), o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = 1400; g.gain.value = .06;

  } catch (_) {}
}
let recTimer = 0, chunks = [], recStart = 0;
async function toggleRec() {
  if (rec) { rec.stop(); return; }
  if (!video.videoWidth) return;
  if (!window.MediaRecorder) { $('#msg').style.display = 'flex'; $('#msgTxt').textContent = 'This browser does not support video recording.'; return; }
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const out = cv.captureStream(30); let mic = null;
  if (micPref === null) await askMic(); // pertama kali rekam video: minta izin mikrofon
  if (micPref === '1') { try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); mic.getAudioTracks().forEach(t => out.addTrack(t)); } catch (_) {} }
  chunks = [];
  rec = new MediaRecorder(out, { mimeType: mime || undefined, videoBitsPerSecond: 3000000 });
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = async () => {
    clearInterval(recTimer); $('#shot').classList.remove('rec'); if (mic) mic.getTracks().forEach(t => t.stop());
    const blob = new Blob(chunks, { type: rec.mimeType || mime || 'video/webm' });
    rec = null;
    await addPhoto({ blob, type: 'video', lens, date: stampText(), ts: Date.now() });
    refreshGallery();
  };
  rec.start(1000); beep(); recStart = Date.now(); $('#shot').classList.add('rec');
  recTimer = setInterval(() => { const t = (Date.now() - recStart) / 1000 | 0; $('#count').textContent = '● ' + String(t / 60 | 0).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }, 500);
}
const doShot = async () => {
  if (!rec && !video.videoWidth) { startCam(); return; } // pertama kali: munculkan dialog izin kamera

  if (!video.videoWidth) return;
  beep();
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  seed = Math.random() * 1e9 | 0; // posisi light leak & debu unik tiap foto
  const c = document.createElement('canvas'); const [cw, ch] = dims(1200); c.width = cw; c.height = ch;
  render(c.getContext('2d'), c.width, c.height);

const TPL = { none:'ORIGINAL', polaroid:'POLAROID', instant:'INSTANT', film:'FILM 35MM', postcard:'POSTCARD', camcorder:'CAMCORDER' };
tplKey = ls.get('rc_tpl'); if (!TPL[tplKey]) tplKey = 'none';
function rrect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function tplMake(src, key, meta) {
  if (key === 'none') return src;
  const W = src.width, H = src.height, k = W / 1200;
  const o = document.createElement('canvas'), g = o.getContext('2d');
  const nm = (LENS[meta.lens] || { name: 'RETRO' }).name, d = new Date(meta.ts), p2 = n => String(n).padStart(2, '0');
  const txt = (t, x, y, font, col, al) => { g.font = font; g.fillStyle = col; g.textAlign = al || 'left'; g.textBaseline = 'alphabetic'; g.fillText(t, x, y); };
  g.imageSmoothingQuality = 'high';
  if (key === 'polaroid') {
    const p = W * .07, b = W * .26; o.width = Math.round(W + 2 * p); o.height = Math.round(H + p + b);
    const bg = g.createLinearGradient(0, 0, 0, o.height); bg.addColorStop(0, '#f7f2e4'); bg.addColorStop(1, '#e9e1cc');
    g.fillStyle = bg; g.fillRect(0, 0, o.width, o.height);
    g.drawImage(src, p, p);
    g.strokeStyle = 'rgba(0,0,0,.28)'; g.lineWidth = 2 * k; g.strokeRect(p, p, W, H);
    txt(meta.date, o.width / 2, H + p + b * .62, `600 ${W * .085}px 'Caveat', cursive`, '#3b3a36', 'center');
  } else if (key === 'instant') {
    const p = W * .09, b = W * .34; o.width = Math.round(W + 2 * p); o.height = Math.round(H + p + b);
    g.fillStyle = '#fcfbf7'; g.fillRect(0, 0, o.width, o.height);
    g.drawImage(src, p, p);
    ['#e8453c', '#f28c28', '#f6d02f', '#4caf50', '#2f7fd1'].forEach((c, i) => { g.fillStyle = c; g.fillRect(p + i * W * .1, H + p + b * .16, W * .1, W * .02); });
    txt('INSTANT FILM', p, H + p + b * .58, `${W * .05}px 'VT323', monospace`, '#8a8578');
    txt(meta.date, o.width - p, H + p + b * .62, `600 ${W * .075}px 'Caveat', cursive`, '#3b3a36', 'right');
    txt(nm, p, H + p + b * .82, `${W * .045}px 'VT323', monospace`, '#a39d8d');
  } else if (key === 'film') {
    const bar = W * .15, side = W * .04; o.width = Math.round(W + 2 * side); o.height = Math.round(H + 2 * bar);
    g.fillStyle = '#1d130b'; g.fillRect(0, 0, o.width, o.height);
    g.drawImage(src, side, bar);
    const hw = W * .045, hh = W * .034, step = W * .075;
    g.fillStyle = '#e9ddbf';
    for (let x = step * .35; x < o.width - hw; x += step) { rrect(g, x, bar * .12, hw, hh, 3 * k); g.fill(); rrect(g, x, o.height - bar * .12 - hh, hw, hh, 3 * k); g.fill(); }
    const f = `${W * .04}px 'VT323', monospace`, amber = '#f0a43a';
    txt('400TX   > 12   > 12A', side, bar * .12 + hh + (bar * .88 - hh) * .8, f, amber);
    txt(nm, side, o.height - bar + (bar * .88 - hh) * .7, f, amber);
    txt('12A  >', o.width - side, o.height - bar + (bar * .88 - hh) * .7, f, amber, 'right');
  } else if (key === 'postcard') {
    const m = W * .06, top = W * .2, bot = W * .17; o.width = Math.round(W + 2 * m); o.height = Math.round(H + top + bot);
    g.fillStyle = '#efe3c4'; g.fillRect(0, 0, o.width, o.height);
    g.fillStyle = 'rgba(120,90,50,.06)'; for (let y = 0; y < o.height; y += 7 * k) g.fillRect(0, y, o.width, k);
    const q = W * .025; g.save(); g.translate(m + W / 2, top + H / 2); g.rotate(-.012);
    g.shadowColor = 'rgba(0,0,0,.35)'; g.shadowBlur = 14 * k; g.shadowOffsetY = 6 * k;
    g.fillStyle = '#fffdf6'; g.fillRect(-W / 2 - q, -H / 2 - q, W + 2 * q, H + 2 * q);
    g.shadowColor = 'transparent'; g.drawImage(src, -W / 2, -H / 2); g.restore();
    const sw = W * .13, sh = W * .15, sx = o.width - m - sw, sy = W * .03;
    g.fillStyle = '#fffdf6'; g.fillRect(sx, sy, sw, sh);
    g.fillStyle = '#d9523a'; g.fillRect(sx + sw * .1, sy + sh * .08, sw * .8, sh * .84);
    g.setLineDash([5 * k, 5 * k]); g.strokeStyle = '#b8ad90'; g.lineWidth = 2 * k; g.strokeRect(sx, sy, sw, sh); g.setLineDash([]);
    txt('RC', sx + sw / 2, sy + sh * .62, `${W * .075}px 'VT323', monospace`, '#fff', 'center');
    const cx = sx - W * .05, cy = sy + sh * .55, r = W * .065;
    g.strokeStyle = 'rgba(70,50,40,.55)'; g.lineWidth = 3 * k; g.beginPath(); g.arc(cx, cy, r, 0, 7); g.stroke();
    for (let i = -1; i <= 1; i++) { g.beginPath(); g.moveTo(cx - r - W * .16, cy + i * W * .02); g.lineTo(cx - r, cy + i * W * .02); g.stroke(); }
    txt(`${p2(d.getDate())}.${p2(d.getMonth() + 1)}`, cx, cy + W * .012, `${W * .04}px 'VT323', monospace`, 'rgba(70,50,40,.7)', 'center');
    txt('WISH YOU WERE HERE', o.width / 2, H + top + bot * .5, `${W * .05}px 'Special Elite', serif`, '#6b4a3a', 'center');
    txt(`${nm} - ${meta.date}`, o.width / 2, H + top + bot * .8, `${W * .04}px 'VT323', monospace`, '#8b6f5a', 'center');
  } else if (key === 'camcorder') {
    o.width = W; o.height = H; g.drawImage(src, 0, 0);
    const m = W * .07, fs = W * .06, L = W * .06, f = `${fs}px 'VT323', monospace`;
    g.shadowColor = 'rgba(0,0,0,.85)'; g.shadowBlur = 4 * k; g.shadowOffsetX = g.shadowOffsetY = 2 * k;
    g.strokeStyle = '#fff'; g.lineWidth = 4 * k;
    [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => { g.beginPath(); g.moveTo(x, y + sy * L); g.lineTo(x, y); g.lineTo(x + sx * L, y); g.stroke(); });
    g.fillStyle = '#e8281c'; g.beginPath(); g.arc(m + W * .05, m + W * .085, W * .018, 0, 7); g.fill();
    txt('REC', m + W * .085, m + W * .105, f, '#fff');
    txt('SP  0:00:' + p2(d.getSeconds()), m + W * .02, H - m - W * .09, f, '#fff');
    txt('PLAY', m + W * .02, H - m - W * .03, f, '#fff');
    const bx = W - m - W * .13, by = m + W * .06; g.lineWidth = 3 * k; g.strokeRect(bx, by, W * .09, W * .045); g.fillStyle = '#fff'; g.fillRect(bx + W * .09, by + W * .013, W * .01, W * .019);
    for (let i = 0; i < 3; i++) g.fillRect(bx + W * .008 + i * W * .027, by + W * .008, W * .021, W * .029);
    txt(`${p2(d.getDate())}.${p2(d.getMonth() + 1)}.${d.getFullYear()}`, W - m - W * .02, H - m - W * .09, f, '#fff', 'right');
    txt(`${p2(d.getHours())}:${p2(d.getMinutes())}`, W - m - W * .02, H - m - W * .03, f, '#fff', 'right');
  }
  return o;
}
let pend = null, pendOut = null;
const tplRow = $('#tplRow');
Object.keys(TPL).forEach(k => {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = TPL[k]; b.dataset.k = k;
  b.onclick = () => { tplKey = k; ls.set('rc_tpl', k); drawTpl(); };
  tplRow.appendChild(b);
});
function drawTpl() {
  pendOut = tplMake(pend.c, tplKey, pend);
  const pv = $('#tplCv'), sc = Math.min(1, 700 / pendOut.width);
  pv.width = Math.round(pendOut.width * sc); pv.height = Math.round(pendOut.height * sc);
  const g = pv.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(pendOut, 0, 0, pv.width, pv.height);
  tplRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === tplKey));
}
function openTpl(c) { pend = { c, lens, date: stampText(), ts: Date.now() }; drawTpl(); $('#tpl').classList.add('open'); }
$('#tplSave').onclick = () => {
  if (!pend) return;
  const P = pend, out = pendOut, key = tplKey; pend = null; $('#tpl').classList.remove('open');
  out.toBlob(async blob => {
    const u = URL.createObjectURL(blob), dv = $('#dev');
    dv.src = u; dv.classList.remove('go'); void dv.offsetWidth; dv.classList.add('go');
    setTimeout(() => URL.revokeObjectURL(u), 4500);
    await addPhoto({ blob, lens: P.lens, date: P.date, ts: P.ts, tpl: key });
    refreshGallery();
  }, 'image/jpeg', .92);
};
$('#tplCancel').onclick = () => { pend = null; $('#tpl').classList.remove('open'); };

// ===== Tema kamera =====
const THEMES = { cream:['CREAM', '#e6dcc3'], blue:['BLUE', '#a9c6e8'], black:['BLACK', '#2a2a2d'], pink:['PINK', '#f3b6d0'], mint:['MINT', '#a9d8c3'], silver:['SILVER', '#c3cad4'] };
const themeRow = $('#themeRow');
function setTheme(k) {
  if (!THEMES[k]) k = 'cream';
  document.documentElement.dataset.theme = k; ls.set('rc_theme', k);
  themeRow.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.k === k));
  const mt = document.querySelector('meta[name=theme-color]'); if (mt) mt.content = THEMES[k][1];
}
Object.keys(THEMES).forEach(k => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.k = k;
  b.innerHTML = '<i class="sw"></i>'; b.firstChild.style.background = THEMES[k][1]; b.append(THEMES[k][0]);
  b.onclick = () => setTheme(k); themeRow.appendChild(b);
});
setTheme(ls.get('rc_theme') || 'cream');

// ===== Jam status & start =====
setInterval(() => { const t = new Date(); $('#clock').textContent = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0'); }, 1000);
(async () => {
  $('#clock').textContent = new Date().toTimeString().slice(0, 5);
  await openDB(); await refreshGallery();
  if (document.fonts) await Promise.all([document.fonts.load("20px 'VT323'"), document.fonts.load("600 20px 'Caveat'"), document.fonts.load("20px 'Special Elite'")]);
  applyFormat(); syncPerm(); requestAnimationFrame(loop);
  if (ls.get('rc_cam') === '1') await startCam(); else showMsg('Allow camera access to start shooting.');
})();
</script>
<script src="/js/pwa.js" defer></script>
